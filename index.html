<html lang="<!-- figma:lang -->">

    <meta charset="UTF-8" />

    <link rel="canonical" href="https://altamiradelosandes.com/" />

    <meta name="theme-color" content="#14120f" />
    <link rel="preload" href="/fonts/Archivo_wdth_wght__1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CormorantGaramond_wght__1.woff2" as="font" type="font/woff2" crossorigin />
    <!-- figma:head-end -->
    <script>
      // Set the theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem('vf-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>

    <!-- figma:body-start -->

    <!-- figma:body-end -->
  </body>
